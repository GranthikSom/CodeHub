[package]
name = "codehub_server"
version = "0.1.0"
edition = "2021"
authors = ["Soham Mondal <soham@codehub.p2p>"]
description = "CodeHub Central Control Plane API Server (Authentication, Repository Indexing, Search, Peer Discovery)"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.2"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
p2p_engine = { path = "../native/p2p_engine" }

name: CodeHub Production CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # 1. Rust Workspace CI (Native P2P Engine, Axum Control Server, CodeHub CLI)
  # ============================================================================
  rust-workspace:
    name: Rust Engine, Server & CLI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Workspace Formatting
        run: cargo fmt --all -- --check

      - name: Cargo Check Entire Workspace
        run: cargo check --workspace --all-targets

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings || cargo clippy --workspace

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Native Shared Library
        run: cargo build --release -p p2p_engine

      - name: Build CodeHub Git CLI Release
        run: cargo build --release -p codehub_cli

      - name: Build Control Server Release
        run: cargo build --release -p codehub_server

  # ============================================================================
  # 2. Flutter Desktop & Web Application CI
  # ============================================================================
  flutter-client:
    name: Flutter Desktop & Web Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain (for Native Engine compilation)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Native P2P Shared Library
        run: |
          cargo build --release -p p2p_engine
          mkdir -p native/p2p_engine/target/debug
          cp target/release/libp2p_engine.so native/p2p_engine/target/debug/ 2>/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Resolve Flutter Dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Static Code Analysis (flutter analyze)
        working-directory: apps/flutter_app
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: apps/flutter_app
        run: flutter test --coverage

      - name: Build Flutter Linux Release Bundle
        working-directory: apps/flutter_app
        run: flutter build linux --release

      - name: Build Flutter Web Release Bundle
        working-directory: apps/flutter_app
        run: flutter build web --release

  # ============================================================================
  # 3. Docker Compose & Infrastructure Validation
  # ============================================================================
  docker-validation:
    name: Docker Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Validate Production Docker Compose Configuration
        working-directory: infrastructure/docker
        run: docker compose config
